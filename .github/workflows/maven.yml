name: CiCd

on:
  push:
    branches: [ "back" ]
  pull_request:
    branches: [ "back" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Étape de Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Docker avec une action dédiée
      - name: Docker install avec action
        uses: docker-practice/actions-setup-docker@master

      # Installer Docker Compose via CLI
      - name: Compose in CLI
        run: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose

      - name: Ex cli
        run: pwd

      # Test Unitaire
      - name: Run unit tests
        run: mvn test

      # Test d'intégration
      #- name: Run integration tests


      # Test fonctionnel
      #- name: Run functional tests 


      # Teardown : arrêter les services Docker
      - name: Teardown (docker-compose down)
        run: docker-compose down

      # Installer Docker
      - name: Install Docker
        run: sudo apt-get install -y docker.io

      # Se connecter à Docker
      - name: Docker login
        run: docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}

      # Construire l'image Docker
      - name: Docker build
        run: docker build -t my-app .

      # Pousser l'image Docker vers le registre
      - name: Docker push
        run: docker push my-app
        
