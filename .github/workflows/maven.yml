name: CI/CD Yelp-EA

on:
  push:
    branches: [main, back]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          sudo ln -s $DOCKER_CONFIG/cli-plugins/docker-compose /usr/local/bin/docker-compose
          docker-compose --version

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
  
      - name: Run backend tests
        run: |
          cd yelp-ea-api
          mvn package
  
      - name: Install Python dependencies for Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager
  
      - name: Start Angular server
        run: |
          cd yelp-ea
          npm install
          npm run start -- --host 0.0.0.0 --disable-host-check &
  
      - name: Wait for Angular app to be ready
        run: |
          echo "⏳ En attente que Angular soit prêt..."
          until curl -s http://localhost:4200 | grep -q "<title>"; do
            echo "⌛ Angular non prêt... on attend encore 5 sec"
            sleep 5
          done
          echo "✅ Angular est prêt !"

  
      - name: Install dependencies for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libx11-xcb1
          sudo apt-get install -y google-chrome-stable
  
      - name: Install ChromeDriver with WebDriverManager
        run: |
          python -m pip install webdriver-manager
          python -c "from webdriver_manager.chrome import ChromeDriverManager; print(ChromeDriverManager().install())"
      
      - name: Check Chrome and ChromeDriver versions
        run: |
          google-chrome --version
          chromedriver --version
  
      - name: Run Selenium tests
        run: |
          cd selenium
          python test_dashboard_restaurateur.py --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/chrome
  
      - name: Teardown
        run: docker-compose down


  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # Étape de Checkout
      - name: Checkout
        uses: actions/checkout@v4
  
      # Se connecter à Docker
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ingivre
          password: dckr_pat_X5EtjyGr3pnJXpq-1cJB_0mYYWM
  
      # Construire l'image Docker
      - name: Pull images
        run: |
          docker pull ingivre/yelp_ea:yelp-ea-api
          docker pull ingivre/yelp_ea:yelp-ea-front
          docker pull ingivre/yelp_ea:mysql-8.0
      # Pousser l'image Docker vers le registre
      - name: Push Docker images
        run: |
          docker push ingivre/yelp_ea:yelp-ea-api
          docker push ingivre/yelp_ea:yelp-ea-front
          docker push ingivre/yelp_ea:mysql-8.0
