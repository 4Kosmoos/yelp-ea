name: CiCd

on:
  push:
    branches: [ "back" ]
  pull_request:
    branches: [ "back" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Étape de Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Docker avec une action dédiée
      - name: Docker install avec action
        uses: docker-practice/actions-setup-docker@master

      # Installer Docker Compose via CLI
      - name: Compose in CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            lsb-release

          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          sudo usermod -aG docker $USER
          newgrp docke
         
  test:
    runs-on: ubuntu-latest
    steps:
      # Test Unitaire
      - name: Run unit tests
        run: mvn test

      # Teardown : arrêter les services Docker
      - name: Teardown (docker-compose down)
        run: docker-compose down


  cd:
    runs-on: ubuntu-latest
    steps:
      # Se connecter à Docker
      - name: Docker login
        run: docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}

      # Construire l'image Docker
      - name: Docker build
        run: docker build -t my-app .

      # Pousser l'image Docker vers le registre
      - name: Docker push
        run: docker push my-app
