on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Étape de Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Docker et Docker Compose
      - name: Install Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          
          # Installer Docker Compose
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          sudo ln -s $DOCKER_CONFIG/cli-plugins/docker-compose /usr/local/bin/docker-compose
          docker-compose --version
          
      # Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Test Unitaire back
      - name: Run unit tests
        run: |
          cd yelp-ea-api
          mvn package

      # Installer Chrome et ChromeDriver
      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-chromedriver
          google-chrome --version
          chromedriver --version
          
      # Installer les dépendances Python pour Selenium
      - name: Install Python dependencies for Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      # Vérifier que Chrome et ChromeDriver sont bien installés
      - name: Verify installations
        run: |
          which google-chrome
          which chromedriver
          ls -l /usr/bin/chromedriver
          
      # Démarrer le serveur Angular
      - name: Start Angular server
        run: |
          cd yelp-ea
          npm install
          npm run start -- --host 0.0.0.0 --disable-host-check &

      # Attendre que le serveur Angular soit accessible
      - name: Wait for Angular server to start
        run: |
          until curl -s http://localhost:4200 > /dev/null; do
            echo "Waiting for Angular to start..."
            sleep 5
          done

      # Exécuter les tests Selenium
      - name: Run Selenium tests
        run: |
          cd selenium
          python test_dashboard_restaurateur.py

      # Teardown : arrêter les services Docker
      - name: Teardown (docker-compose down)
        run: docker-compose down

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # Étape de Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Se connecter à Docker
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ingivre
          password: dckr_pat_X5EtjyGr3pnJXpq-1cJB_0mYYWM


      # Construire l'image Docker
      - name: Pull images
        run: |
          docker pull ingivre/yelp_ea:yelp-ea-api
          docker pull ingivre/yelp_ea:yelp-ea-front
          docker pull ingivre/yelp_ea:mysql-8.0

      # Pousser l'image Docker vers le registre
      - name: Push Docker images
        run: |
          docker push ingivre/yelp_ea:yelp-ea-api
          docker push ingivre/yelp_ea:yelp-ea-front
          docker push ingivre/yelp_ea:mysql-8.0

  deploy:
    needs: cd
    runs-on: ubuntu-latest
    steps:
      # Étape de Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Vérifier si Docker Compose est installé
      - name: Verify Docker Compose installation
        run: |
          if ! command -v docker-compose &> /dev/null; then
            echo "Docker Compose could not be found. Installing..."
            curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose --version

      # Déployer avec Docker Compose
      - name: Deploy with Docker Compose
        run: docker-compose up -d

