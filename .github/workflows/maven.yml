on:
  push:
    branches: [ "back" ]
  pull_request:
    branches: [ "back" ]

jobs:
  ci-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run unit tests
        run: |
          cd yelp-ea-api
          mvn test

  ci-build:
    name: Build & Push Docker Images
    needs: ci-tests  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installer Docker et Compose
      - name: Install Docker and Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo docker --version
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose

      - name: Docker login
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: Build & Push Backend Image
        run: |
          cd yelp-ea-api
          docker build -t ingivre/yelp_ea:yelp-ea-api .
          docker push ingivre/yelp_ea:yelp-ea-api

      - name: Build & Push Frontend Image
        run: |
          cd yelp-ea
          docker build -t ingivre/yelp_ea:yelp-ea-front .
          docker push ingivre/yelp_ea:yelp-ea-front

  cd-deploy:
    name: Deploy Application
    needs: ci-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        run: |
          echo "🚀 Déploiement en cours..."
          # Exemple de déploiement avec SSH et Docker Compose :
          # ssh user@your-server "cd /path/to/your/project && docker-compose pull && docker-compose up -d"

      # Teardown : arrêter les services Docker
      - name: Teardown
        run: docker-compose down
