name: CI/CD Yelp-EA

on:
  push:
    branches: [main, back]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Docker + Docker Compose
      - name: Install Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          sudo ln -s $DOCKER_CONFIG/cli-plugins/docker-compose /usr/local/bin/docker-compose
          docker-compose --version

      # Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Build + tests backend
      - name: Run backend tests
        run: |
          cd yelp-ea-api
          mvn clean package

      # Build image backend
      - name: Build backend Docker image
        run: |
          cd yelp-ea-api
          docker build -t ingivre/yelp_ea:yelp-ea-api .

      # Build image frontend
      - name: Build frontend Docker image
        run: |
          cd yelp-ea
          npm install
          docker build -t ingivre/yelp_ea:yelp-ea-front .

      # Chrome + Selenium
      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-chromedriver
          google-chrome --version
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      # Lancer Angular localement (si besoin pour test Selenium)
      - name: Start Angular server
        run: |
          cd yelp-ea
          npm run start -- --host 0.0.0.0 --disable-host-check &
      
      - name: Wait for Angular to start
        run: |
          until curl -s http://localhost:4200 > /dev/null; do
            echo "Waiting for Angular to start..."
            sleep 5
          done

      - name: Run Selenium tests
        run: |
          cd selenium
          python test_dashboard_restaurateur.py

      # Login & Push Docker images
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ingivre
          password: dckr_pat_X5EtjyGr3pnJXpq-1cJB_0mYYWM

      - name: Push Docker images
        run: |
          docker push ingivre/yelp_ea:yelp-ea-api
          docker push ingivre/yelp_ea:yelp-ea-front

      - name: Teardown Docker Compose
        run: docker-compose down || true

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ingivre
          password: dckr_pat_X5EtjyGr3pnJXpq-1cJB_0mYYWM

      - name: Pull Docker images
        run: |
          docker pull ingivre/yelp_ea:yelp-ea-api
          docker pull ingivre/yelp_ea:yelp-ea-front
          docker pull ingivre/yelp_ea:mysql-8.0

      - name: Push Docker images (confirm latest)
        run: |
          docker push ingivre/yelp_ea:yelp-ea-api
          docker push ingivre/yelp_ea:yelp-ea-front
          docker push ingivre/yelp_ea:mysql-8.0

  deploy:
    needs: cd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: docker-compose --version

      - name: Deploy with Docker Compose
        run: docker-compose up -d
