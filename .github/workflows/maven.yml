on:
  push:
    branches: [ "main", "back" ]
  pull_request:
    branches: [ "main", "back" ]

jobs:
  # Job pour configurer l'environnement
  setup_environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Docker
      - name: Docker install avec action
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo docker --version

      # Installer Docker Compose via CLI
      - name: Compose in CLI
        run: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          sudo ln -s $DOCKER_CONFIG/cli-plugins/docker-compose /usr/local/bin/docker-compose

      # Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cacher les dépendances Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

  # Job pour exécuter les tests unitaires
  run_tests:
    needs: setup_environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Exécuter les tests unitaires
      - name: Run unit tests
        run: |
          cd yelp-ea-api
          mvn package

  # Job pour installer Chrome et ChromeDriver
  setup_chrome:
    needs: setup_environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installer Chrome et ChromeDriver
      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-chromedriver
          google-chrome --version
          chromedriver --version

      # Installer les dépendances Python pour Selenium
      - name: Install Python dependencies for Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      # Vérifier l'installation de Chrome et ChromeDriver
      - name: Verify installations
        run: |
          which google-chrome
          which chromedriver
          ls -l /usr/bin/chromedriver

  # Job pour démarrer le serveur Angular
  start_angular_server:
    needs: setup_chrome
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Démarrer le serveur Angular
        run: |
          cd yelp-ea
          npm install
          npm run start -- --host 0.0.0.0 --disable-host-check &

      # Attendre que le serveur Angular soit accessible
      - name: Wait for Angular server to start
        run: |
          until curl -s http://localhost:4200 > /dev/null; do
            echo "Waiting for Angular to start..."
            sleep 5
          done

  # Job pour exécuter les tests Selenium
  run_selenium_tests:
    needs: start_angular_server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Exécuter les tests Selenium
      - name: Run Selenium tests
        run: |
          cd selenium
          python test_dashboard_restaurateur.py

  # Job pour le teardown des services Docker
  teardown:
    needs: [run_tests, run_selenium_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Teardown (docker-compose down)
        run: docker-compose down

  # Job pour build et push de l'image Docker du backend
  build_and_push_backend:
    needs: run_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build backend Docker image
        run: |
          cd yelp-ea-api
          docker build -t mydockerhub/back:latest .
      - name: Push backend Docker image
        run: docker push mydockerhub/back:latest

  # Job pour build et push de l'image Docker du frontend
  build_and_push_frontend:
    needs: run_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build frontend Docker image
        run: |
          cd yelp-ea
          docker build -t mydockerhub/front:latest .
      - name: Push frontend Docker image
        run: docker push mydockerhub/front:latest
