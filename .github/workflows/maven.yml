on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & push backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ingivre/yelp_ea:yelp-ea-api

    - name: Build & push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend  # chemin vers ton projet Angular
        file: ./frontend/Dockerfile
        push: true
        tags: ingivre/yelp_ea:yelp-ea-front

    - name: Build & push MySQL image (si tu veux en garder une version custom)
      uses: docker/build-push-action@v5
      with:
        context: ./mysql  # dossier contenant ton Dockerfile ou init script
        file: ./mysql/Dockerfile
        push: true
        tags: ingivre/yelp_ea:mysql-8.0
