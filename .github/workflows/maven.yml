name: CI/CD

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installer Docker et Docker Compose
      - name: Set up Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Démarrer les containers via docker-compose
      - name: Start containers
        run: |
          docker-compose up -d

      # Attendre que le backend soit prêt
      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          sleep 30
          curl --fail http://localhost:8080 || exit 1

      # Exécuter les tests Selenium
      - name: Run Selenium tests
        run: |
          pip install selenium webdriver-manager
          cd selenium
          python test_dashboard_restaurateur.py

      # Teardown : arrêter les services Docker
      - name: Teardown
        run: docker-compose down

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se connecter à Docker Hub pour pousser les images
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Pousser les images Docker vers Docker Hub
      - name: Push Docker images
        run: |
          docker push ingivre/yelp_ea:yelp-ea-api
          docker push ingivre/yelp_ea:yelp-ea-front
          docker push ingivre/yelp_ea:mysql-8.0
