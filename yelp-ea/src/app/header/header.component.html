<header class="app-header">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <!-- Menu pour Restaurateur -->
      <div *ngIf="userRole === UserRole.owner" class="nav-items">
        <button class="btn-custom" (click)="viewRestaurants()">Voir mes restaurants</button>
        <button class="btn-custom" (click)="addRestaurant()">Ajouter un restaurant</button>
      </div>

      <!-- Menu pour Utilisateur classique -->
      <div *ngIf="userRole === UserRole.customer" class="nav-items">
        <button class="btn-custom" (click)="viewAllRestaurants()">Voir tous les restaurants</button>
        <button class="btn-custom" (click)="ListeRestoNotePage()">Voir les restaurants déjà notés</button>
      </div>

      <!-- Menu pour Admin -->
      <div *ngIf="userRole === UserRole.admin" class="nav-items">
        <button class="btn-custom" (click)="viewUsers()">Voir les utilisateurs</button>
        <button class="btn-custom" (click)="viewRestaurateurs()">Voir les restaurants</button>
      </div>

      <!-- Bouton de déconnexion aligné à droite -->
      <div class="nav-items logout-btn">
        <button class="btn-danger" (click)="logout()">Déconnexion</button>
      </div>
    </div>
  </nav>
</header>
