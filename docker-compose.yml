version: "3.8"

services: 
  mysqldb:
    image: mysql:8.0
    container_name: mysql-container
    networks:
      - yelp-ea
    ports:
      - "3307:3306"
    volumes:
      - biblio-mysql-data:/var/lib/mysql
    environment: 
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: yelp-ea

  backend:
    image: yelp-ea-api
    container_name: backend-container
    networks:
      - yelp-ea
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/yelp?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
    depends_on:
      - mysqldb

  frontend:
    image: yelp-ea-front
    container_name: frontend-container
    networks:
      - yelp-ea
    depends_on:
      - backend
    ports:
      - "4200:80"

networks:
  yelp-ea:

volumes:
  biblio-mysql-data: