version: "3.8"

services: 
  mysqldb:
    image: mysql:8.0
    ports:
      - "3307:3306"
    volumes:
      - biblio-mysql-data:/var/lib/mysql
    environment: 
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: yelp
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: yelp-ea-api
    build:
      context: ./yelp-ea-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/yelp?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: app_password
    depends_on:
      mysqldb:
        condition: service_healthy

  db-seed:
    image: mysql:8.0
    volumes:
      - ./data/mock_data.sql:/mock_data.sql
    entrypoint: >
      bash -c "
        echo '🕒 Attente que la DB soit prête...';
        sleep 10;
        echo '⏳ Attente du backend (création des tables)...';
        sleep 20;
        echo '🚀 Insertion des données';
        mysql -h mysqldb -uapp_user -papp_password yelp < /mock_data.sql;
        echo '✅ Données injectées';
      "
    depends_on:
      backend:
        condition: service_started

  frontend:
    image: yelp-ea-front
    build:
      context: ./yelp-ea
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  biblio-mysql-data:
